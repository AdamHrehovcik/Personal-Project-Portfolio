project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "**/*.qmd"
    - "!files/"   # /files holds static downloads (PDFs, notebooks) — never render these as pages
  resources:
    - "files/**"

website:
  title: "Adam Hrehovcik"
  description: "Data & Business Analytics — projects, reports, and code"
  site-url: "https://adamhrehovcik.github.io"

  navbar:
    title: false   # "Adam Hrehovcik" already sits directly under the navbar on the homepage -- redundant here
    background: "#2c3e50"
    foreground: "#ffffff"
    left:
      - href: index.qmd
        text: Home
      - text: Projects
        menu:
          - href: machine-learning.qmd
            text: Machine Learning & Data Science
          - href: business-analytics.qmd
            text: Data & Business Analytics
      - href: about.qmd
        text: About Me
    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/adam-hrehovcik/
        aria-label: LinkedIn
      - icon: github
        href: https://github.com/AdamHrehovcik
        aria-label: GitHub
      - icon: envelope
        href: mailto:adam.hrehovcik@gmail.com
        aria-label: Email

  page-footer:
    left: "© 2026 Adam Hrehovcik"
    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/adam-hrehovcik/
      - icon: envelope
        href: mailto:adam.hrehovcik@gmail.com

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    grid:
      body-width: 850px
    code-fold: true       # collapses code blocks by default on project pages — reader chooses to expand
    code-tools: true       # adds a "view source" affordance
    fig-align: center

execute:
  freeze: auto   # only re-runs code when the source .qmd changes — keeps rebuilds fast
